name: backtest

# Щотижнева перевірка сигналів на історії (неділя 02:17 UTC) + ручний запуск.
on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write                  # лише запис звіту в гілку backtest цього репозиторію

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest         # стандартний раннер: у публічному репозиторії безкоштовний
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install matplotlib
        run: pip install --quiet matplotlib==3.9.2
      - name: Backtest (public market data, no keys)
        run: node src/backtest.js
      - name: Strategy backtest 1h/4h/1d (entries & exits)
        run: node src/strategy_bt.js
      - name: Fear & Greed index backtest
        run: node src/fng_bt.js
      - name: Summary chart
        run: python src/plot_backtest.py
      - name: Publish backtest branch (overwritten each run)
        run: |
          cd "$RUNNER_TEMP" && rm -rf out && mkdir out && cd out
          git init -q -b backtest
          cp -r "$GITHUB_WORKSPACE/backtest/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "backtest $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" backtest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
