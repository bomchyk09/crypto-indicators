name: indicators

# Тричі на добу приблизно за 70 хв до перевірок Claude (07:07, 15:07, 23:07 Київ).
# GitHub може запускати розклад із затримкою до ~1 год — тому запас.
on:
  schedule:
    - cron: "57 3,11,19 * * *"   # UTC
  workflow_dispatch:               # ручний запуск: Actions → indicators → Run workflow
    inputs:
      add:
        description: "Додати монети (тикери через кому, напр. TAO,LINK)"
        required: false
        default: ""
      remove:
        description: "Прибрати монети (тикери через кому)"
        required: false
        default: ""

permissions:
  contents: write                  # лише запис у цей самий репозиторій

concurrency:
  group: indicators
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest         # стандартний раннер: у публічному репозиторії безкоштовний
    timeout-minutes: 15            # запобіжник (24 монети ≈ 1–2 хв)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install matplotlib
        run: pip install --quiet matplotlib==3.9.2

      - name: Update coin list (only on manual run with add/remove)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.add != '' || inputs.remove != '') }}
        env:
          ADD: ${{ inputs.add }}
          REMOVE: ${{ inputs.remove }}
        run: |
          node src/manage.js "add=$ADD" "remove=$REMOVE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          git diff --cached --quiet || { git commit -m "config: add=$ADD remove=$REMOVE"; git push; }

      # Попередні стани і журнал сигналів — з гілки results (щоб визначати переходи й вести журнал)
      - name: Restore state and journal
        run: |
          mkdir -p data charts
          if git fetch --depth=1 origin results:refs/remotes/origin/results 2>/dev/null; then
            git show origin/results:data/state.json > data/state.json || rm -f data/state.json
            git show origin/results:data/journal.csv > data/journal.csv || rm -f data/journal.csv
            echo "restored: $(ls data)"
          fi

      - name: Compute indicators (public market data, no keys)
        run: node src/compute.js
      - name: Draw charts
        run: python src/plot.py

      # Результати — одна коміт-версія в гілці results (перезаписується; історія не накопичується)
      - name: Publish results branch
        run: |
          cd "$RUNNER_TEMP" && rm -rf out && mkdir out && cd out
          git init -q -b results
          cp -r "$GITHUB_WORKSPACE/data" "$GITHUB_WORKSPACE/charts" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "results $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
